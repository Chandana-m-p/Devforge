version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/devforgedb
      - DATABASE_USERNAME=devforge
      - DATABASE_PASSWORD=secretpassword
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  postgres:
    image: postgres:15-alpine
    container_name: devforge-postgres
    environment:
      POSTGRES_DB: devforgedb
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
